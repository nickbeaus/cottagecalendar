<VirtualHost *:8080>
    DocumentRoot /app/html
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    <Directory /app/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html

        # Never serve hidden files or editor/backup copies (e.g. .git, file.php~, file.php.bak).
        <FilesMatch "(^\.|~$|\.(bak|old|orig|swp|sql)$)">
            Require all denied
        </FilesMatch>
    </Directory>

    # The old app's backup page was migrate.php.
    Redirect permanent /migrate.php /backup.php

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'"

    # The calendar page is re-checked on every visit, so updates show up right away.
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>
</VirtualHost>
