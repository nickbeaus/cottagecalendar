<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <clipPath id="appIcon">
            <rect width="100" height="100" rx="22"/>
        </clipPath>

        <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#3b82f6" />
        </linearGradient>

        <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0369a1" />
            <stop offset="100%" stop-color="#082f49" />
        </linearGradient>

        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#fde047" flood-opacity="0.8"/>
        </filter>
    </defs>

    <g clip-path="url(#appIcon)">
        <rect width="100" height="100" fill="url(#skyGrad)"/>

        <circle cx="75" cy="30" r="14" fill="#fbbf24" />

        <polygon points="5,65 15,35 25,65" fill="#0f766e" />
        <polygon points="20,65 30,45 40,65" fill="#0d9488" />
        <polygon points="70,65 85,25 100,65" fill="#0f766e" />
        <polygon points="60,65 70,40 80,65" fill="#0d9488" />

        <rect x="0" y="62" width="100" height="38" fill="url(#waterGrad)"/>

        <rect x="15" y="68" width="30" height="2" fill="#38bdf8" rx="1" opacity="0.5"/>
        <rect x="55" y="73" width="35" height="2" fill="#38bdf8" rx="1" opacity="0.4"/>
        <rect x="25" y="78" width="50" height="2" fill="#38bdf8" rx="1" opacity="0.3"/>
        <rect x="40" y="84" width="20" height="1.5" fill="#38bdf8" rx="0.75" opacity="0.2"/>

        <rect x="35" y="62" width="30" height="4" fill="#92400e" rx="1"/> <rect x="38" y="66" width="3" height="12" fill="#451a03" rx="1"/> <rect x="59" y="66" width="3" height="12" fill="#451a03" rx="1"/> <rect x="22" y="38" width="56" height="25" fill="#e7e5e4" />

        <rect x="64" y="22" width="8" height="15" fill="#a8a29e" />
        <rect x="62" y="20" width="12" height="3" fill="#78716c" rx="1" />

        <polygon points="12,42 50,18 88,42 82,46 50,26 18,46" fill="#1e293b" />

        <rect x="43" y="47" width="14" height="16" fill="#0284c7" rx="1.5"/>
        <circle cx="53" cy="56" r="1.5" fill="#ffffff" />

        <rect x="28" y="45" width="10" height="10" fill="#fef08a" rx="1" filter="url(#glow)"/>
        <path d="M 33 45 L 33 55 M 28 50 L 38 50" stroke="#b45309" stroke-width="1.5" opacity="0.6"/>

        <rect x="62" y="45" width="10" height="10" fill="#fef08a" rx="1" filter="url(#glow)"/>
        <path d="M 67 45 L 67 55 M 62 50 L 72 50" stroke="#b45309" stroke-width="1.5" opacity="0.6"/>
    </g>
</svg>
